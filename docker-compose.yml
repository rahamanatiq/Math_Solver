services:
  web:
    build: .
    command: gunicorn auth_system.wsgi:application --bind 0.0.0.0:8000 --timeout 300
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - db_data:/app/db
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DB_PATH=/app/db/db.sqlite3
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  celery:
    build: .
    command: celery -A auth_system worker -l info
    volumes:
      - .:/app
      - db_data:/app/db
    env_file:
      - .env
    environment:
      - DB_PATH=/app/db/db.sqlite3
    depends_on:
      redis:
        condition: service_healthy

volumes:
  static_volume:
  db_data:
